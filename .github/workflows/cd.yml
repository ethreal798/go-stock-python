name: CD

on:
  pull_request:
    branches:
      - dev/1.0
    types:
      - closed
  workflow_dispatch:
    inputs:
      environment:
        description: Deploy environment
        required: true
        default: production
        type: choice
        options:
          - staging
          - production

jobs:
  deploy:
    name: Sync Code And Deploy
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
    environment:
      name: ${{ github.event.inputs.environment || 'production' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync latest project code to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          source: "backend/app,backend/alembic,backend/alembic.ini,backend/requirements.txt,backend/Dockerfile,backend/.dockerignore,frontend/src,frontend/package.json,frontend/package-lock.json,frontend/index.html,frontend/vite.config.ts,frontend/tsconfig.json,frontend/tsconfig.app.json,frontend/tsconfig.node.json,frontend/eslint.config.js,frontend/Dockerfile,frontend/nginx.conf,docker-compose.prod.yml,nginx.conf"
          target: "${{ secrets.DEPLOY_PATH || '/opt/go-stock-python' }}"

      - name: Deploy on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -e

            DEPLOY_PATH="${{ secrets.DEPLOY_PATH }}"
            if [ -z "$DEPLOY_PATH" ]; then
              DEPLOY_PATH="/opt/go-stock-python"
            fi

            mkdir -p "$DEPLOY_PATH"
            cd "$DEPLOY_PATH"

            cat > .env <<EOF
            POSTGRES_USER=${{ secrets.POSTGRES_USER }}
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            POSTGRES_DB=${{ secrets.POSTGRES_DB }}
            DATABASE_URL=postgresql+asyncpg://${{ secrets.POSTGRES_USER }}:${{ secrets.POSTGRES_PASSWORD }}@postgres:5432/${{ secrets.POSTGRES_DB }}
            REDIS_URL=redis://redis:6379/0
            DEBUG=false
            SECRET_KEY=${{ secrets.SECRET_KEY }}
            AI_API_KEY=${{ secrets.AI_API_KEY }}
            AI_BASE_URL=${{ secrets.AI_BASE_URL }}
            AI_MODEL_NAME=${{ secrets.AI_MODEL_NAME }}
            CORS_ORIGINS_STR=${{ secrets.CORS_ORIGINS_STR }}
            EOF

            echo "开始基于服务器最新代码构建镜像..."
            docker compose --env-file .env -f docker-compose.prod.yml build --pull backend frontend

            echo "启动最新服务..."
            docker compose --env-file .env -f docker-compose.prod.yml up -d --remove-orphans

            echo "等待数据库就绪..."
            sleep 20

            echo "执行数据库迁移..."
            docker compose --env-file .env -f docker-compose.prod.yml exec -T backend alembic upgrade head

            echo "检查服务状态..."
            docker compose --env-file .env -f docker-compose.prod.yml ps
            curl -f http://localhost/health || echo "警告：健康检查暂未通过，请继续检查容器日志"

            docker image prune -f
