name: CD

on:
  pull_request:
    branches:
      - dev/1.0
    types:
      - closed
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}
  RELEASE_TAG: release-${{ github.run_id }}-${{ github.run_attempt }}

# 同一时间只允许一个生产部署，避免多个任务同时操作服务器。
concurrency:
  group: cd-dev-1.0
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.service }}

    # PR 合并后执行；手动触发时也执行。
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.merged == true

    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        service:
          - backend
          - frontend

    steps:
      - name: Checkout production branch
        uses: actions/checkout@v4
        with:
          ref: dev/1.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:${{ env.RELEASE_TAG }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:dev-1.0
          cache-from: type=gha,scope=go-stock-python-${{ matrix.service }}
          cache-to: type=gha,mode=min,scope=go-stock-python-${{ matrix.service }},ignore-error=true

  deploy:
    name: Deploy to server
    needs:
      - build

    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: production

    steps:
      - name: Checkout production branch
        uses: actions/checkout@v4
        with:
          ref: dev/1.0

      - name: Sync deployment configuration
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          source: "docker-compose.prod.yml,nginx.conf"
          target: "${{ secrets.DEPLOY_PATH || '/opt/go-stock-python' }}"

      - name: Deploy on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          command_timeout: 10m
          script: |
            set -Eeuo pipefail

            DEPLOY_PATH="${{ secrets.DEPLOY_PATH }}"
            if [ -z "$DEPLOY_PATH" ]; then
              DEPLOY_PATH="/opt/go-stock-python"
            fi

            cd "$DEPLOY_PATH"

            cat > .env <<EOF
            BACKEND_IMAGE=ghcr.io/${{ github.repository }}-backend:${{ env.RELEASE_TAG }}
            FRONTEND_IMAGE=ghcr.io/${{ github.repository }}-frontend:${{ env.RELEASE_TAG }}
            POSTGRES_USER=${{ secrets.POSTGRES_USER }}
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            POSTGRES_DB=${{ secrets.POSTGRES_DB }}
            DATABASE_URL=postgresql+asyncpg://${{ secrets.POSTGRES_USER }}:${{ secrets.POSTGRES_PASSWORD }}@postgres:5432/${{ secrets.POSTGRES_DB }}
            REDIS_URL=redis://redis:6379/0
            DEBUG=false
            SECRET_KEY=${{ secrets.SECRET_KEY }}
            AI_API_KEY=${{ secrets.AI_API_KEY }}
            AI_BASE_URL=${{ secrets.AI_BASE_URL }}
            AI_MODEL_NAME=${{ secrets.AI_MODEL_NAME }}
            CORS_ORIGINS_STR=${{ secrets.CORS_ORIGINS_STR }}
            EOF

            chmod 600 .env

            compose() {
              docker compose \
                --env-file .env \
                -f docker-compose.prod.yml \
                "$@"
            }

            diagnostics() {
              echo "部署失败，输出容器状态和日志..."
              compose ps || true
              compose logs --tail=150 || true
            }

            trap diagnostics ERR

            echo "${{ github.token }}" |
              docker login ghcr.io \
                -u "${{ github.actor }}" \
                --password-stdin

            echo "拉取本次发布的镜像..."
            timeout 5m compose pull

            echo "启动服务..."
            timeout 3m compose up \
              -d \
              --no-build \
              --remove-orphans

            echo "等待后端容器运行..."
            BACKEND_READY=0

            for i in $(seq 1 30); do
              if [ -n "$(compose ps --status running -q backend)" ]; then
                BACKEND_READY=1
                break
              fi

              echo "后端尚未运行，等待 5 秒（${i}/30）..."
              sleep 5
            done

            if [ "$BACKEND_READY" != "1" ]; then
              echo "后端容器未能正常运行"
              exit 1
            fi

            echo "执行数据库迁移..."
            compose exec -T backend alembic upgrade head

            echo "等待应用健康检查..."
            HEALTHY=0

            for i in $(seq 1 30); do
              if curl \
                -fsS \
                --max-time 5 \
                http://localhost/health \
                >/dev/null; then
                HEALTHY=1
                break
              fi

              echo "健康检查尚未通过，等待 5 秒（${i}/30）..."
              sleep 5
            done

            if [ "$HEALTHY" != "1" ]; then
              echo "应用健康检查失败"
              exit 1
            fi

            echo "清理未使用的旧镜像..."
            docker image prune -f || true

            compose ps
            docker logout ghcr.io || true

            trap - ERR
            echo "部署成功：${{ env.RELEASE_TAG }}"